name: Build release zip

# Reusable workflow: checks out a tag, builds the JS bundle, installs prod
# Composer deps (so the plugin-update-checker vendor/ ships), patches the
# version into style.css + functions.php + package.json, packs a version-less
# <slug>.zip (slug = the style.css Text Domain) via rsync + .distignore, and
# uploads it to the
# matching GitHub Release.
#
# Called from release-please.yml (automatic when release-please publishes a
# release) and release.yml (workflow_dispatch fallback for re-attaching).
#
# The asset filename is intentionally version-less so the GitHub download URL
# is stable (/releases/download/v<X.Y.Z>/<slug>.zip) and the theme's
# ThemeUpdater asset regex (derived from get_stylesheet()) matches without
# per-release edits.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build the release zip for (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  attach-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Install Composer prod deps (PUC) into vendor/
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress

      - name: Build JS bundle
        run: |
          npm ci
          npm run build

      - name: Patch version into style.css, functions.php and package.json
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # release-please now bumps style.css + functions.php in the release
          # commit (see release-please-config.json extra-files), so PUC reads the
          # correct Version: at the tag. These two seds are a harmless idempotent
          # backstop for the zip's internal consistency; the package.json patch
          # below stays load-bearing (package.json carries no release-please marker).
          VERSION="${TAG#v}"
          sed -i -E "s/^(Version:[[:space:]]+).+$/\1$VERSION/" style.css
          sed -i -E "s/(define\([[:space:]]*'PEDIMENT_CHILD_VERSION',[[:space:]]*')[^']*('[[:space:]]*\))/\1$VERSION\2/" functions.php
          VERSION="$VERSION" node -e "const p=require('./package.json');p.version=process.env.VERSION;require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
          grep -E "^Version:" style.css
          grep "PEDIMENT_CHILD_VERSION" functions.php
          grep '"version"' package.json

      - name: Resolve theme slug from style.css
        id: slug
        run: |
          SLUG=$(sed -nE 's/^Text Domain:[[:space:]]*//p' style.css | head -1 | tr -d '[:space:]')
          test -n "$SLUG" || { echo "::error::Could not read Text Domain from style.css"; exit 1; }
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Theme slug: $SLUG"

      - name: Build distributable zip
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          STAGE="$(mktemp -d)/$SLUG"
          mkdir -p "$STAGE"
          rsync -a --exclude-from=.distignore ./ "$STAGE/"
          ( cd "$(dirname "$STAGE")" && zip -rq "$GITHUB_WORKSPACE/$SLUG.zip" "$SLUG" )
          unzip -l "$SLUG.zip" | tail -5

      - name: Upload zip to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          SLUG: ${{ steps.slug.outputs.slug }}
        run: gh release upload "$TAG" "$SLUG.zip" --clobber
